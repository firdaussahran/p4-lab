name: Compile tunnel.p4

# Compiles tunnel.p4 with the same P4 compiler as the lab image, on every push and pull request.
# A red cross means the program doesn't compile; open the run to read the compiler's message.
# Warnings are shown in the log but don't fail the check.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    container: ghcr.io/firdaussahran/p4-lab:1.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile tunnel.p4
        run: |
          mkdir -p build
          p4c-bm2-ss -o build/tunnel.json tunnel.p4
          echo "tunnel.p4 compiled."
